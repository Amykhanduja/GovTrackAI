<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Error</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #d32f2f;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-box {
            background-color: #fff;
            border: 1px solid #ddd;
            border-left: 4px solid #d32f2f;
            padding: 15px;
            margin-bottom: 20px;
            flex-grow: 1;
            overflow-y: auto;
            font-family: Consolas, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        button.primary {
            background-color: #1976d2;
            color: white;
            border-color: #1976d2;
        }

        button.primary:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>
    <h2>⚠️ GovTrack AI failed to start.</h2>
    <p>Reason:</p>
    <div class="error-box" id="error-message">Unknown error occurred during startup.</div>
    
    <div class="buttons">
        <button id="btn-logs">Open Logs</button>
        <button id="btn-retry" class="primary">Retry</button>
        <button id="btn-exit">Exit</button>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;
        const { listen } = window.__TAURI__.event;
        const { exit } = window.__TAURI__.process;
        
        // Listen for the error message
        listen('startup-error-details', (event) => {
            document.getElementById('error-message').innerText = event.payload;
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            exit(1);
        });

        document.getElementById('btn-retry').addEventListener('click', () => {
            // Relaunch the app
            invoke('relaunch_app');
        });

        document.getElementById('btn-logs').addEventListener('click', () => {
            invoke('open_logs_folder');
        });
    </script>
</body>
</html>
